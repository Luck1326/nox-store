<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body data-page="contact">
  <a class="skip" href="#icerik">İçeriğe geç</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html"><img src="img/logo.svg" alt=""> Nox</a>
      <form class="header-search" id="header-search" role="search">
        <label class="sr-only" for="header-search-input">Ara</label>
        <input id="header-search-input" type="search" placeholder="Ürün ara">
      </form>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">Menü</button>
      <nav class="nav" id="site-nav">
        <a href="index.html">Ana sayfa</a>
        <a href="urunler.html">Ürünler</a>
        <a href="hakkimizda.html">Hakkımızda</a>
        <a href="iletisim.html" aria-current="page">İletişim</a>
        <a class="cart-link" href="sepet.html">Sepet <span class="cart-count" data-cart-count hidden>0</span></a>
      </nav>
    </div>
  </header>

  <main id="icerik" class="wrap">
    <div class="page-title">
      <h1>Yaz, cevap demo’da kalır.</h1>
      <p class="muted">Form gönderilmez; sadece arayüz durur. Gerçek posta: merhaba@nox.example</p>
    </div>
    <form class="summary form-grid" style="max-width:520px;margin-bottom:64px;" onsubmit="event.preventDefault(); this.querySelector('[data-note]').hidden=false;">
      <label class="field">Ad
        <input name="ad">
      </label>
      <label class="field">Mesaj
        <textarea name="mesaj"></textarea>
      </label>
      <button class="btn" type="submit">Gönder</button>
      <p class="muted" data-note hidden>Bu sayfa sunucuya gitmez. Teşekkürler.</p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>Nox — demo vitrin, 2026</p>
      <p>HTML, CSS ve JavaScript ile kuruldu.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=4"></script>
  <script src="js/products.js?v=4"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js?v=4"></script>
</body>
